CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# The custom matrix_animation.c module owns the 25 WS2812 LEDs.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# Keep the USB identity explicit for external shields. This is also the name
# shown in the browser's serial-port picker used by ZMK Studio.
CONFIG_ZMK_KEYBOARD_NAME="Soroka"

# ZMK Studio over the USB CDC-ACM transport.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
